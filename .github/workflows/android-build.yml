name: My Drive Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub Settings → Environments → release
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Restore the permanent signing keystore
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYDRIVE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/mydrive-release.jks"

      # Build signed Release APK
      - name: Build Release APK
        env:
          MYDRIVE_KEYSTORE_PASSWORD: ${{ secrets.MYDRIVE_KEYSTORE_PASSWORD }}
          MYDRIVE_KEY_ALIAS: ${{ secrets.MYDRIVE_KEY_ALIAS }}
          MYDRIVE_KEY_PASSWORD: ${{ secrets.MYDRIVE_KEY_PASSWORD }}
          MYDRIVE_KEYSTORE_FILE: ${{ runner.temp }}/signing/mydrive-release.jks
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/release/*.apk" -type f | head -n 1)
          test -n "$APK"
          cp "$APK" "My-Drive-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Drive-APK
          path: My-Drive-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Drive Build ${{ github.run_number }}
          files: My-Drive-release.apk
          generate_release_notes: false
