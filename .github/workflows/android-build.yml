name: My Drive Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub Settings -> Environments -> release
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # Restore the permanent signing keystore. The value is never printed.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYDRIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MYDRIVE_KEYSTORE_BASE64 is not set in the release environment."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/mydrive-release.jks"
          if [ ! -s "$RUNNER_TEMP/signing/mydrive-release.jks" ]; then
            echo "::error::Failed to restore the signing keystore."
            exit 1
          fi

      # Build the signed Release APK using the permanent My Drive key.
      - name: Build Release APK
        env:
          MYDRIVE_KEYSTORE_FILE: ${{ runner.temp }}/signing/mydrive-release.jks
          MYDRIVE_KEYSTORE_PASSWORD: ${{ secrets.MYDRIVE_KEYSTORE_PASSWORD }}
          MYDRIVE_KEY_ALIAS: ${{ secrets.MYDRIVE_KEY_ALIAS }}
          MYDRIVE_KEY_PASSWORD: ${{ secrets.MYDRIVE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      # Locate the signed Release APK, reject unsigned/debug output, and verify
      # the package identity and signing certificate before publishing.
      - name: Verify signed Release APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          echo "Release APK: $APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK build-tools directory not found."
            exit 1
          fi

          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

          AAPT2=$(find "$SDK_ROOT/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK" | grep -m 1 '^package:' || true)
            echo "Package: $BADGING"
            case "$BADGING" in
              *"name='com.mydrive.app'"*) ;;
              *)
                echo "::error::Unexpected package/applicationId in release APK."
                exit 1
                ;;
            esac
          else
            echo "::warning::aapt2 not found; skipped package identity check."
          fi

          cp "$APK" "My-Drive-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Drive-APK
          path: My-Drive-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: My Drive Build ${{ github.run_number }}
          files: My-Drive-release.apk
          generate_release_notes: false
